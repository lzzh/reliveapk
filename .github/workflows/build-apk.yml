name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "$ANDROID_HOME" >> $GITHUB_PATH
          # 写 local.properties 指向 SDK
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          # 装 cmdline-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/clt.zip
          ls -lh /tmp/clt.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools/"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # 接受许可并安装必需组件
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          # 检查装好的 SDK
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties 2>/dev/null || echo "(no local.properties)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee build.log
          echo "=== build.log 末尾 ==="
          tail -60 build.log

      - name: Show output
        if: always()
        run: |
          echo "=== APK 产物 ==="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "(APK 未生成)"
          echo "=== build.log 错误段 ==="
          grep -iE 'error|fail|exception|cannot|denied|FAILED' app/build.log build.log 2>/dev/null | head -40 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: relive-photo-apk
          path: app/build/outputs/apk/debug/*.apk
