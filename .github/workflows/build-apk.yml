name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME" >> $GITHUB_PATH
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          # 动态找当前可用的 cmdline-tools 版本号（Google 会轮换"latest"构建号）
          CLT_VER=""
          for v in 13114758 12700310 11076708 9477386; do
            code=$(curl -sI -o /dev/null -w '%{http_code}' "https://dl.google.com/android/repository/commandlinetools-linux-${v}_latest.zip" || echo 000)
            if [ "$code" = "200" ]; then CLT_VER=$v; break; fi
          done
          if [ -z "$CLT_VER" ]; then echo "No valid cmdline-tools version found"; exit 1; fi
          echo "Using commandlinetools-linux-${CLT_VER}_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${CLT_VER}_latest.zip" -o /tmp/clt.zip
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools/"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # 用 expect 式喂 yes（避免 `yes |` 的 broken pipe 在 pipefail 下误判失败）
          printf 'y\ny\ny\ny\ny\ny\ny\ny\n' | "$SM" --licenses || true
          "$SM" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          echo "=== 校验 SDK ==="
          ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar" && echo "android-34 OK"

      - name: Build Debug APK
        run: |
          set -uo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties 2>/dev/null || echo "(no local.properties)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "gradle exit code = $RC"
          if [ "$RC" != "0" ]; then
            echo "=== build.log 末尾 80 行（真正根因在这）==="
            tail -80 build.log
            exit "$RC"
          fi

      - name: Show output
        if: always()
        run: |
          echo "=== APK 产物 ==="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "(APK 未生成)"
          echo "=== build.log 错误段 ==="
          grep -iE 'error|fail|exception|cannot|denied|FAILED' app/build.log build.log 2>/dev/null | head -40 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: relive-photo-apk
          path: app/build/outputs/apk/debug/*.apk
